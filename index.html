<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tesla CoDriver MCU2</title>

  <!-- OpenStreetMap Engine -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0e121a; font-family: -apple-system, sans-serif; color: #fff; }

    #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

    /* Dark mode overlay for standard OpenStreetMap tiles */
    .dark-map .leaflet-tile {
      filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3);
    }

    /* Vertical Dashboard Header */
    .top-card {
      position: absolute; top: 20px; left: 20px; right: 20px; height: 90px;
      background: rgba(14, 18, 26, 0.95); border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; z-index: 10; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .speed-block { display: flex; align-items: baseline; gap: 8px; }
    .speed-val { font-size: 52px; font-weight: 900; color: #00e5ff; font-family: monospace; }
    .speed-unit { font-size: 16px; color: #8a99ad; font-weight: 700; }

    .status-block { text-align: right; }
    .status-title { font-size: 20px; font-weight: 700; color: #ffffff; }
    .status-sub { font-size: 14px; color: #00ff88; font-weight: 600; margin-top: 4px; }

    /* Driver Action Buttons */
    .bottom-grid {
      position: absolute; bottom: 30px; left: 20px; right: 20px;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; z-index: 10;
    }
    .action-btn {
      background: rgba(20, 26, 38, 0.95); border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px; height: 76px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #fff; font-size: 15px;
      font-weight: 700; cursor: pointer;
    }
    .action-btn:active { background: #00e5ff; color: #000; }
    .btn-icon { font-size: 24px; margin-bottom: 2px; }

    /* Custom GPS Marker */
    .car-dot {
      width: 22px; height: 22px; background: #00e5ff; border: 3px solid #ffffff;
      border-radius: 50%; box-shadow: 0 0 16px #00e5ff;
    }
  </style>
</head>
<body>

  <div id="map" class="dark-map"></div>

  <!-- Header -->
  <div class="top-card">
    <div class="speed-block">
      <span id="speed" class="speed-val">0</span>
      <span class="speed-unit">MPH</span>
    </div>
    <div class="status-block">
      <div id="street-name" class="status-title">CoDriver Connected</div>
      <div id="alert-status" class="status-sub">⚡ Radar & Hazards Active</div>
    </div>
  </div>

  <!-- Bottom Buttons -->
  <div class="bottom-grid">
    <div class="action-btn" onclick="addAlert('Police Radar Trap', '👮')">
      <span class="btn-icon">👮</span> Police
    </div>
    <div class="action-btn" onclick="addAlert('Road Hazard Ahead', '⚠️')">
      <span class="btn-icon">⚠️</span> Hazard
    </div>
    <div class="action-btn" onclick="addAlert('Heavy Traffic', '🚗')">
      <span class="btn-icon">🚗</span> Traffic
    </div>
    <div class="action-btn" onclick="recenterMap()">
      <span class="btn-icon">🎯</span> Recenter
    </div>
  </div>

  <script>
    // Default fallback coordinates (New York City) until GPS syncs
    let currentLat = 40.7128;
    let currentLng = -74.0060;

    const map = L.map('map', { zoomControl: false }).setView([currentLat, currentLng], 15);
    
    // Standard open tiles (works everywhere without blocks)
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Marker Setup
    const carIcon = L.divIcon({ className: 'car-dot', iconSize: [22, 22] });
    let carMarker = L.marker([currentLat, currentLng], { icon: carIcon }).addTo(map);

    // Live Geolocation Tracking
    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;
          const speedMetresPerSec = pos.coords.speed || 0;
          const speedMph = Math.round(speedMetresPerSec * 2.23694);

          document.getElementById('speed').innerText = speedMph;

          carMarker.setLatLng([currentLat, currentLng]);
          map.panTo([currentLat, currentLng], { animate: true });
        },
        (err) => {
          console.log("GPS Notice:", err.message);
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
      );
    }

    function addAlert(type, emoji) {
      L.marker([currentLat, currentLng]).addTo(map)
        .bindPopup(`<b>${emoji} ${type}</b><br>Reported just now`)
        .openPopup();

      const status = document.getElementById('alert-status');
      status.innerText = `Reported: ${type}`;
      status.style.color = "#ffb703";
      
      setTimeout(() => {
        status.innerText = "⚡ Radar & Hazards Active";
        status.style.color = "#00ff88";
      }, 4000);
    }

    function recenterMap() {
      map.setView([currentLat, currentLng], 15);
    }
  </script>
</body>
</html>
