<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tesla CoDriver</title>

  <!-- Leaflet CSS & JS (100% Free, No API Key Required) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0b0e14; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #ffffff; }

    #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

    /* Dark theme filter applied to OpenStreetMap tiles */
    .leaflet-tile-container img {
      filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) !important;
    }

    /* Top Dashboard Status Bar */
    .top-bar {
      position: absolute; top: 16px; left: 16px; right: 16px; height: 74px;
      background: rgba(18, 24, 38, 0.92); border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; z-index: 10; backdrop-filter: blur(8px);
    }
    .speed-container { display: flex; align-items: baseline; gap: 6px; }
    .speed-val { font-size: 40px; font-weight: 800; color: #00e5ff; font-family: monospace; }
    .speed-unit { font-size: 14px; color: #a0aec0; text-transform: uppercase; font-weight: 600; }

    .route-info { text-align: right; }
    .route-street { font-size: 18px; font-weight: 700; color: #fff; }
    .route-alert { font-size: 13px; color: #00ff88; font-weight: 600; }

    /* Bottom Touch Grid for MCU2 Screen */
    .bottom-bar {
      position: absolute; bottom: 24px; left: 16px; right: 16px;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; z-index: 10;
    }
    .btn {
      background: rgba(22, 30, 46, 0.95); border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px; height: 68px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #fff; font-size: 13px;
      font-weight: 600; cursor: pointer;
    }
    .btn:active { background: #00e5ff; color: #000; }
    .btn-icon { font-size: 22px; margin-bottom: 2px; }

    /* Custom Live Location Marker */
    .user-marker {
      width: 22px; height: 22px; background: #00e5ff; border: 3px solid #ffffff;
      border-radius: 50%; box-shadow: 0 0 15px rgba(0,229,255,0.9);
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Top Display -->
  <div class="top-bar">
    <div class="speed-container">
      <div id="speed" class="speed-val">0</div>
      <div class="speed-unit">MPH</div>
    </div>
    <div class="route-info">
      <div id="street" class="route-street">CoDriver Ready</div>
      <div id="status" class="route-alert">⚡ Radar & Road Alert Layer Active</div>
    </div>
  </div>

  <!-- Bottom Buttons -->
  <div class="bottom-bar">
    <div class="btn" onclick="reportIncident('Police Trap', '👮')">
      <span class="btn-icon">👮</span> Cops
    </div>
    <div class="btn" onclick="reportIncident('Hazard / Object', '⚠️')">
      <span class="btn-icon">⚠️</span> Hazard
    </div>
    <div class="btn" onclick="reportIncident('Traffic Jam', '🚗')">
      <span class="btn-icon">🚗</span> Traffic
    </div>
    <div class="btn" onclick="recenterMap()">
      <span class="btn-icon">🎯</span> Recenter
    </div>
  </div>

  <script>
    // Initialize Leaflet map with standard OpenStreetMap tiles
    // Default initial location set to London, updates instantly on GPS grab
    let userLat = 51.5074;
    let userLng = -0.1278;

    const map = L.map('map', { zoomControl: false }).setView([userLat, userLng], 15);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Create marker icon
    const carIcon = L.divIcon({ className: 'user-marker', iconSize: [22, 22] });
    let carMarker = L.marker([userLat, userLng], { icon: carIcon }).addTo(map);

    // Geolocation Watcher
    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          userLat = pos.coords.latitude;
          userLng = pos.coords.longitude;
          const speedMetresPerSec = pos.coords.speed || 0;
          const currentSpeed = Math.round(speedMetresPerSec * 2.23694);

          document.getElementById('speed').innerText = currentSpeed;
          document.getElementById('street').innerText = "Live GPS Active";

          carMarker.setLatLng([userLat, userLng]);
          map.panTo([userLat, userLng]);
        },
        (err) => {
          document.getElementById('street').innerText = "GPS Offline";
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
      );
    }

    function reportIncident(type, emoji) {
      L.marker([userLat, userLng]).addTo(map)
        .bindPopup(`<b>${emoji} ${type}</b><br>Reported just now`)
        .openPopup();

      const status = document.getElementById('status');
      status.innerText = `Reported: ${type}`;
      status.style.color = "#ffb703";
      
      setTimeout(() => {
        status.innerText = "⚡ Radar & Road Alert Layer Active";
        status.style.color = "#00ff88";
      }, 4000);
    }

    function recenterMap() {
      map.setView([userLat, userLng], 15);
    }
  </script>
</body>
</html>
