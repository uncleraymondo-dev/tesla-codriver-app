<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CoDriver Companion for Tesla</title>

  <!-- Mapbox GL JS -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0b0e14; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #ffffff; }

    #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

    /* Top Navigation Status Bar */
    .top-bar {
      position: absolute; top: 16px; left: 16px; right: 16px; height: 70px;
      background: rgba(18, 24, 38, 0.92); border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; backdrop-filter: blur(8px); z-index: 10;
    }
    .speed-container { display: flex; align-items: baseline; gap: 6px; }
    .speed-val { font-size: 38px; font-weight: 800; color: #00e5ff; font-family: monospace; }
    .speed-unit { font-size: 14px; color: #a0aec0; text-transform: uppercase; font-weight: 600; }

    .route-info { text-align: right; }
    .route-street { font-size: 18px; font-weight: 700; color: #fff; }
    .route-alert { font-size: 13px; color: #ffb703; font-weight: 600; }

    /* Bottom Quick Action Bar for Vertical Screen */
    .bottom-bar {
      position: absolute; bottom: 24px; left: 16px; right: 16px;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; z-index: 10;
    }
    .btn {
      background: rgba(22, 30, 46, 0.95); border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px; height: 64px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #fff; font-size: 13px;
      font-weight: 600; cursor: pointer; transition: background 0.15s;
    }
    .btn:active { background: #00e5ff; color: #000; }
    .btn-icon { font-size: 20px; margin-bottom: 2px; }

    /* Custom Map Pins */
    .user-marker {
      width: 24px; height: 24px; background: #00e5ff; border: 3px solid #ffffff;
      border-radius: 50%; box-shadow: 0 0 15px rgba(0,229,255,0.8);
    }
    .alert-popup { color: #000; font-weight: bold; }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Top Status -->
  <div class="top-bar">
    <div class="speed-container">
      <div id="speed" class="speed-val">0</div>
      <div class="speed-unit">MPH</div>
    </div>
    <div class="route-info">
      <div id="street" class="route-street">Locating...</div>
      <div id="status" class="route-alert">⚡ Radar & Road Alert Layer Active</div>
    </div>
  </div>

  <!-- Bottom Touch Actions -->
  <div class="bottom-bar">
    <div class="btn" onclick="reportIncident('Police Trap')">
      <span class="btn-icon">👮</span> Cops
    </div>
    <div class="btn" onclick="reportIncident('Hazard / Object')">
      <span class="btn-icon">⚠️</span> Hazard
    </div>
    <div class="btn" onclick="reportIncident('Traffic Jam')">
      <span class="btn-icon">🚗</span> Traffic
    </div>
    <div class="btn" onclick="toggleMapPitch()">
      <span class="btn-icon">🌐</span> 2D / 3D
    </div>
  </div>

  <script>
    // Initialize Mapbox (Using public default tile style)
    mapboxgl.accessToken = 'pk.eyJ1IjoibWFwYm94IiwiYSI6ImNpejY4M29iazA2Z2gycXA4N2pmbDZmangifQ.-g_vE53SD2WrJ6tFX7QHmA'; 

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/dark-v11',
      center: [-122.4194, 37.7749],
      zoom: 15,
      pitch: 45
    });

    // Custom Location Marker
    const el = document.createElement('div');
    el.className = 'user-marker';
    const marker = new mapboxgl.Marker(el).setLngLat([-122.4194, 37.7749]).addTo(map);

    // Geolocation Tracking for Tesla Browser
    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude, longitude, speed } = pos.coords;
          const currentSpeed = speed ? Math.round(speed * 2.23694) : 0; // m/s to mph

          document.getElementById('speed').innerText = currentSpeed;
          marker.setLngLat([longitude, latitude]);
          map.flyTo({ center: [longitude, latitude], speed: 1.2 });
        },
        (err) => console.log(err),
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
      );
    }

    // 1-Tap Community Reporting
    function reportIncident(type) {
      const center = map.getCenter();
      new mapboxgl.Popup({ offset: 25 })
        .setLngLat(center)
        .setHTML(`<div class="alert-popup">🚨 Reported: ${type}</div>`)
        .addTo(map);
      
      document.getElementById('status').innerText = `Reported: ${type}`;
      setTimeout(() => {
        document.getElementById('status').innerText = "⚡ Radar & Road Alert Layer Active";
      }, 4000);
    }

    // Toggle 2D / 3D Perspective (Lite mode for MCU2 Intel Atom)
    let is3D = true;
    function toggleMapPitch() {
      is3D = !is3D;
      map.easeTo({ pitch: is3D ? 45 : 0, duration: 500 });
    }
  </script>
</body>
</html>
