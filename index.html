<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tesla 3D CoDriver Navigation</title>

  <!-- Mapbox GL JS & Geocoder -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.min.js"></script>
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.css" type="text/css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0b0e14; font-family: -apple-system, sans-serif; color: #fff; }

    #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

    /* Top Navigation Banner */
    .top-panel {
      position: absolute; top: 16px; left: 16px; right: 16px;
      display: flex; flex-direction: column; gap: 10px; z-index: 10;
    }
    .nav-bar {
      height: 70px; background: rgba(18, 24, 38, 0.95); border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; backdrop-filter: blur(8px);
    }
    .speed-box { display: flex; align-items: baseline; gap: 6px; }
    .speed-val { font-size: 38px; font-weight: 900; color: #00e5ff; font-family: monospace; }
    .speed-unit { font-size: 13px; color: #a0aec0; font-weight: 700; }

    /* Turn Banner */
    .turn-card {
      background: #00e5ff; color: #0b0e14; padding: 14px 20px; border-radius: 14px;
      font-size: 18px; font-weight: 800; display: none; justify-content: space-between; align-items: center;
    }

    /* Destination Search Box Styling */
    .mapboxgl-ctrl-geocoder {
      width: 100% !important; max-width: none !important; background: rgba(22, 30, 46, 0.95) !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important; border-radius: 14px !important;
      box-shadow: none !important; color: #fff !important;
    }
    .mapboxgl-ctrl-geocoder--input { color: #fff !important; font-size: 16px !important; }

    /* Bottom Control Bar */
    .bottom-bar {
      position: absolute; bottom: 24px; left: 16px; right: 16px;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; z-index: 10;
    }
    .btn {
      background: rgba(22, 30, 46, 0.95); border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px; height: 64px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #fff; font-size: 13px; font-weight: 700;
      cursor: pointer;
    }
    .btn:active { background: #00e5ff; color: #000; }
    .btn-icon { font-size: 20px; margin-bottom: 2px; }

    /* Custom 3D Vehicle Marker */
    .car-marker {
      width: 24px; height: 24px; background: #00e5ff; border: 3px solid #ffffff;
      border-radius: 50%; box-shadow: 0 0 20px rgba(0, 229, 255, 0.9);
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Navigation Panel -->
  <div class="top-panel">
    <div class="nav-bar">
      <div class="speed-box">
        <div id="speed" class="speed-val">0</div>
        <div class="speed-unit">MPH</div>
      </div>
      <div id="search-container" style="flex: 1; margin-left: 16px;"></div>
    </div>
    
    <div id="turn-card" class="turn-card">
      <span id="turn-text">Searching route...</span>
      <span id="turn-dist">--</span>
    </div>
  </div>

  <!-- Driver Action Buttons -->
  <div class="bottom-bar">
    <div class="btn" onclick="reportIncident('Police Trap', '👮')">
      <span class="btn-icon">👮</span> Cops
    </div>
    <div class="btn" onclick="reportIncident('Hazard', '⚠️')">
      <span class="btn-icon">⚠️</span> Hazard
    </div>
    <div class="btn" onclick="reportIncident('Traffic', '🚗')">
      <span class="btn-icon">🚗</span> Traffic
    </div>
    <div class="btn" onclick="toggle3D()">
      <span class="btn-icon">🌐</span> 2D / 3D
    </div>
  </div>

  <script>
    // Configured with your Mapbox Public Token
    mapboxgl.accessToken = 'pk.eyJ1IjoidW5jbGVyYXltb25kby1kZXYiLCJhIjoiY213NzJvZ3BsMG90cDMwcnh5a3JtamE4bCJ9.uOBPlo6XoSLmmx1AXsYxYA';

    let userLng = -122.4194;
    let userLat = 37.7749;
    let userHeading = 0;

    // 1. Initialize Mapbox in 3D Perspective Mode
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/dark-v11',
      center: [userLng, userLat],
      zoom: 16,
      pitch: 60,
      bearing: 0
    });

    // Recalculate canvas size on initial load for mobile/car displays
    map.on('load', () => {
      map.resize();
    });

    // 2. Custom Car Marker
    const carEl = document.createElement('div');
    carEl.className = 'car-marker';
    const carMarker = new mapboxgl.Marker(carEl).setLngLat([userLng, userLat]).addTo(map);

    // 3. Search Box Geocoder Setup
    const geocoder = new MapboxGeocoder({
      accessToken: mapboxgl.accessToken,
      mapboxgl: mapboxgl,
      placeholder: "Where to?",
      marker: false
    });
    document.getElementById('search-container').appendChild(geocoder.onAdd(map));

    // 4. Calculate Navigation Route on Search Selection
    geocoder.on('result', (e) => {
      const destCoords = e.result.center;
      getRoute(destCoords);
    });

    async function getRoute(destination) {
      try {
        const query = await fetch(
          `https://api.mapbox.com/directions/v5/mapbox/driving/${userLng},${userLat};${destination[0]},${destination[1]}?steps=true&geometries=geojson&access_token=${mapboxgl.accessToken}`
        );
        const json = await query.json();
        const data = json.routes[0];
        const route = data.geometry.coordinates;

        // Update Navigation Turn Banner
        if (data.legs[0].steps.length > 0) {
          const nextStep = data.legs[0].steps[0];
          document.getElementById('turn-card').style.display = 'flex';
          document.getElementById('turn-text').innerText = nextStep.maneuver.instruction;
          document.getElementById('turn-dist').innerText = `${Math.round(nextStep.distance)} m`;
        }

        // Draw the Route Line on the Map
        const geojson = {
          type: 'Feature',
          properties: {},
          geometry: { type: 'LineString', coordinates: route }
        };

        if (map.getSource('route')) {
          map.getSource('route').setData(geojson);
        } else {
          map.addLayer({
            id: 'route',
            type: 'line',
            source: { type: 'geojson', data: geojson },
            layout: { 'line-join': 'round', 'line-cap': 'round' },
            paint: { 'line-color': '#00e5ff', 'line-width': 7, 'line-opacity': 0.85 }
          });
        }

        map.flyTo({ center: [userLng, userLat], zoom: 17, pitch: 60 });
      } catch (err) {
        console.error("Routing error:", err);
      }
    }

    // 5. Geolocation Tracking & 3D Camera Follow
    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          userLat = pos.coords.latitude;
          userLng = pos.coords.longitude;
          const speedMetresPerSec = pos.coords.speed || 0;
          userHeading = pos.coords.heading || 0;
          const speedMph = Math.round(speedMetresPerSec * 2.23694);

          document.getElementById('speed').innerText = speedMph;
          carMarker.setLngLat([userLng, userLat]);

          // Lock 3D camera to vehicle position & direction
          map.easeTo({
            center: [userLng, userLat],
            bearing: userHeading,
            duration: 1000,
            easing: (t) => t
          });
        },
        (err) => console.log("GPS Error:", err),
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
      );
    }

    // 6. Community Alerts
    function reportIncident(type, emoji) {
      new mapboxgl.Popup({ offset: 25 })
        .setLngLat([userLng, userLat])
        .setHTML(`<div style="color:#000; font-weight:bold;">${emoji} ${type} Reported</div>`)
        .addTo(map);
    }

    // 7. Toggle 2D Flat / 3D Navigation Camera
    let is3D = true;
    function toggle3D() {
      is3D = !is3D;
      map.easeTo({ pitch: is3D ? 60 : 0, duration: 600 });
    }
  </script>
</body>
</html>
